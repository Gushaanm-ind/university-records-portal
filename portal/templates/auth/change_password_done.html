{% extends "base.html" %}

{% block title %}Password Changed - University Portal{% endblock %}
{% block page_title %}Password changed{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; text-align: center;">
    <div class="stat-icon tone-graduation" style="margin: 0 auto 0.9rem; width: 48px; height: 48px;">
        <svg class="icon"><use href="#i-check"/></svg>
    </div>
    <h2 style="margin-top: 0;">Your password has been updated</h2>
    <p style="margin-bottom: 1.25rem;">Use the new password the next time you sign in.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Back to dashboard</a>
</div>
{% endblock %}
